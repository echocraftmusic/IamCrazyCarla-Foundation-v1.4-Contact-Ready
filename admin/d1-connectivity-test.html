<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Carla D1 Connection Test</title><style>body{background:#130e0e;color:#f5eeea;font:16px/1.6 system-ui;padding:32px;max-width:720px;margin:auto}h1{color:#eac59b}button{background:#9e1a2e;color:white;border:0;border-radius:9px;padding:13px 18px;margin:6px 8px 6px 0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#241d1e;padding:20px;border-radius:10px}a{color:#ffd89c}</style></head><body><h1>Carla Review Connection Test</h1><p>Temporary connectivity check. The published Review Manager is unchanged.</p><button id="login">1. Open Cloudflare login</button><button id="check">2. Check admin connection</button><pre id="result">Waiting for test.</pre><script>
const api='https://reviews-api.iamcrazycarla.com/api/admin/reviews';const result=document.querySelector('#result');
document.querySelector('#login').onclick=()=>{window.open(api,'_blank','noopener,noreferrer');result.textContent='Complete Cloudflare one-time PIN login in the opened tab, then return and click Check admin connection.';};
document.querySelector('#check').onclick=async()=>{result.textContent='Checking…';try{const r=await fetch(api,{credentials:'include',cache:'no-store',headers:{Accept:'application/json'}});const t=await r.text();if(!r.ok)throw Error('HTTP '+r.status+' '+t.slice(0,140));const j=JSON.parse(t);if(!Array.isArray(j.reviews))throw Error('Unexpected API response');result.textContent='PASS: Administrator API returned '+j.reviews.length+' review(s).';}catch(e){result.textContent='FAILED: '+e.message+'. Take a screenshot of this result.';}};
</script></body></html>
