name: Update Crazy Carla YouTube videos

on:
  schedule:
    # Wednesday 8:00 PM Eastern while daylight saving time is active.
    - cron: '0 0 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the live branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current YouTube reader
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check --upgrade yt-dlp
          python -m yt_dlp --version

      - name: Show JSON state before refresh
        run: |
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Current file:"
          cat data/youtube-videos.json || true

      - name: Refresh Carla's newest four uploads
        run: python scripts/update_youtube.py

      - name: Verify updater really wrote fresh data
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path("data/youtube-videos.json")
          if not p.exists():
              raise SystemExit("ERROR: youtube-videos.json was not created.")

          data = json.loads(p.read_text(encoding="utf-8"))
          videos = data.get("videos", [])

          if len(videos) != 4:
              raise SystemExit(f"ERROR: expected exactly 4 videos, found {len(videos)}.")

          checked = data.get("last_checked_at") or data.get("updated_at")
          if not checked:
              raise SystemExit("ERROR: no successful-check timestamp was written.")

          dt = datetime.fromisoformat(checked.replace("Z", "+00:00"))
          age = (datetime.now(timezone.utc) - dt).total_seconds()
          if age > 600:
              raise SystemExit(
                  f"ERROR: updater left stale data. Check timestamp is {age:.0f}s old."
              )

          print("Verified fresh YouTube JSON:")
          for i, v in enumerate(videos, 1):
              print(f"{i}. {v.get('published')} | {v.get('id')} | {v.get('title')}")
          PY

      - name: Commit and push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/youtube-videos.json

          if git diff --cached --quiet; then
            echo "ERROR: updater ran but produced no repository change."
            exit 1
          fi

          git commit -m "Refresh Crazy Carla YouTube feed"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Confirm pushed JSON exists in the branch
        run: |
          git fetch origin ${{ github.event.repository.default_branch }}
          echo "Remote branch now contains:"
          git show origin/${{ github.event.repository.default_branch }}:data/youtube-videos.json
