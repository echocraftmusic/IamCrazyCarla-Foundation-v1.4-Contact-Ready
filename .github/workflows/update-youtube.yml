name: Update Crazy Carla YouTube videos
on:
  schedule:
    # Wednesday 8:00 PM Eastern during daylight time = Thursday 00:00 UTC.
    # GitHub cron uses UTC; this may run at 7:00 PM Eastern after the fall time change.
    - cron: '0 0 * * 4'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public YouTube feed
        run: python scripts/update_youtube.py
      - name: Commit updated video data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-videos.json
          git diff --cached --quiet || git commit -m "Update Crazy Carla YouTube videos"
          git push
