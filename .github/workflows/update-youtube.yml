name: Update Crazy Carla YouTube videos

on:
  schedule:
    # Wednesday 8:00 PM Eastern during daylight saving time.
    # GitHub Actions cron uses UTC.
    - cron: '0 0 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the live branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm YouTube API key exists
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::Missing repository secret YOUTUBE_API_KEY"
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "YouTube API key secret is present."

      - name: Refresh Carla's newest four YouTube uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_youtube.py

      - name: Verify fresh JSON
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/youtube-videos.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          videos = data.get("videos", [])

          if len(videos) != 4:
              raise SystemExit(
                  f"Expected exactly 4 videos, found {len(videos)}."
              )

          checked = data.get("last_checked_at")
          if not checked:
              raise SystemExit("Missing last_checked_at.")

          stamp = datetime.fromisoformat(checked.replace("Z", "+00:00"))
          age = (datetime.now(timezone.utc) - stamp).total_seconds()

          if age < -60 or age > 600:
              raise SystemExit(
                  f"JSON is not fresh; last_checked_at is {checked}."
              )

          print("Verified current JSON:")
          for number, video in enumerate(videos, 1):
              print(
                  f"{number}. {video.get('published')} | "
                  f"{video.get('id')} | {video.get('title')}"
              )
          PY

      - name: Commit updated video data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/youtube-videos.json

          if git diff --cached --quiet; then
            echo "No file change to commit."
            exit 0
          fi

          git commit -m "Update Crazy Carla YouTube videos"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Confirm remote branch contains the update
        run: |
          git fetch origin ${{ github.event.repository.default_branch }}
          git show origin/${{ github.event.repository.default_branch }}:data/youtube-videos.json
