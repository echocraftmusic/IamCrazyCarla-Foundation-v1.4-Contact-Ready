name: Update Crazy Carla YouTube videos

on:
  schedule:
    # Wednesday 8:00 PM Eastern during daylight time = Thursday 00:00 UTC.
    # GitHub cron uses UTC; after the fall time change this runs at 7:00 PM ET.
    - cron: '0 0 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YouTube reader
        run: python -m pip install --disable-pip-version-check --upgrade yt-dlp

      - name: Refresh Crazy Carla YouTube data
        run: python scripts/update_youtube.py

      - name: Commit updated video data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-videos.json

          if git diff --cached --quiet; then
            echo "No YouTube changes to commit."
            exit 0
          fi

          git commit -m "Update Crazy Carla YouTube videos"
          git push
